<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panna Equipamentos</title>
    <link rel="icon" href="assets/logo_group.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js" integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
    <script src="https://cloudflare.com" defer></script>
</head>

<body class="page page--home">
    <header>
        <nav class="navbar">
            <ul class="navbar__list">
                <li><button type="button" class="navbar__btn-menu" id="toggle-sidebar" aria-label="Mostrar ou ocultar menu lateral" aria-expanded="true"><img src="assets/btn_menu.svg" alt="botao menu"></button></li>
                <li class="navbar__item"><img class="navbar__logo" id="navbar-logo" src="assets/logo_group.png"></li>
                <li class="navbar__item" id="navbar-manage-equipment"> • Gestão interna</li>
            </ul>    
        </nav>
    </header>

    <div class="layout-container">
        <div class="sidebar" id="side-menu">
            <ul>
                <li class="sidebar__buttons sidebar__buttons--active"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='CE1.html'"><img src="assets/icon_file.svg" alt="botao menu">Cadastrar Equipamentos</button></li>
                <li class="sidebar__buttons"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='GE1.html'"><img src="assets/icon_box.svg" alt="botao menu">Gerenciar Equipamentos</button></li>
                <li class="sidebar__buttons"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='#'"><img src="assets/icon_truck.svg" alt="botao menu">Transferir</button></li>
                <li class="sidebar__buttons"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='#'"><img src="assets/icon_maintenance.png" alt="botao menu" style="width: 20px; height: 20px;">Manutenção</button></li>
                <li class="sidebar__buttons"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='#'"><img src="assets/icon_report.png" alt="botao menu" style="width: 20px; height: 20px;">Relatórios</button></li>
            </ul>

            <footer class="footer_sidebar">
                <button type="button" class="navbar__btn-menu" onclick="window.location.href = 'index.html'"><img src="assets/logo_profile.svg" alt="botao menu"></button>
            </footer>
        </div>

        <main class="main-content">
            <h1 class="title-h1">Equipamento cadastrado com sucesso</h1>
            <h3 class="title-h3">Imprima ou compartilhe o QR Code para identificar o equipamento em campo.</h3>

            <div class="form-card--qrcode">
                <form class="register-form register-form--success">
                   <div class="register-form__header">
                        <div>
                            <h2 class="title-h2">Aspirador de pó industrial</h2>
                            <h4 class="title-h4">#00185538</h4>
                        </div>

                        <p class="title-inform">• Cadastrado</p>    
                    </div>    

                    <div class="register-form__finish">
                        <img src="assets/qr_code.png" alt="QR Code" class="register-form__qr-code">

                        <div class="register-form__export-actions">
                            <button type="button" class="export-item" id="equipment-share">
                                <img src="assets/icon_share.png" alt="Ícone de compartilhar" class="export-item__icon" width="18">
                                <span class="action-btn">Compartilhar</span>
                            </button>

                            <button type="button" class="export-item" id="equipment-download">
                                <img src="assets/icon_download.png" alt="Ícone de download" class="export-item__icon" width="18">
                                <span class="action-btn">Baixar</span>
                            </button>

                            <button type="button" class="export-item" id="equipment-print">
                                <img src="assets/icon_printer.png" alt="Ícone de imprimir" class="export-item__icon" width="18">
                                <span class="action-btn">Imprimir</span>
                            </button>
                        </div>
                     </div>
    <h3 class="title-h3">Dica: cole o QR Code no equipamento para abrir chamados e registrar avarias pelo celular.</h3>

    <!-- BOTÕES FINAIS -->
    <div class="register-form__actions">
        <button type="button" class="button button--register-equip" onclick="window.location.href ='CE1.html'">
            <img src="assets/icon_plus.svg" alt="Ícone de +" class="button__icon" width="18">
            <span>Cadastrar outro equipamento</span>
        </button>

        <button type="button" class="button button--cancel">Ver Equipamento</button>
        <button type="button" class="button button--cancel" onclick="window.location.href ='HomeDesk.html'">Fechar</button>
    </div>
                </form>
            </div>
        </main>
    </div>
    <!-- JavaScript compartilhado: menu, armazenamento e cadastro. -->
    <script src="equipamentos-iniciais.js"></script>
    <script src="panna.js"></script>
</body>
</html>
