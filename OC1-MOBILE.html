<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panna Equipamentos</title>
  <link rel="icon" href="assets/logo_group.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cloudflare.com" defer></script>
</head>


<body class="page page--home">
    <header>
       <nav class="navbar">
            <ul class="navbar__list">
                <li><button type="button" class="navbar__btn-menu" id="toggle-sidebar" aria-label="Mostrar ou ocultar menu lateral" aria-expanded="true"><img src="assets/btn_menu.svg" alt="botao menu"></button></li>
                <li class="navbar__item"><img class="navbar__logo" id="navbar-logo" src="assets/logo_group.png"></li>
            </ul>    
        </nav>
    </header>

     <main class="main-content main-content--field">
            <h1 class="title-h1">Operação em campo</h1>
            <h3 class="title-h3">Escolha a ação que você quer realizar.</h3>

        <div class="field-actions">
            <button type="button" class="export-item export-item--field" id="field-open-ticket" onclick="window.location.href ='OC2-MOBILE.html'">
            <img src="assets/icon_maintenance.png" alt="Ícone de manutenção" class="export-item__icon" width="18">
            <span class="action-btn">Abrir chamado de manutenção</span>
            </button>

            <button type="button" class="export-item export-item--field" id="field-report-fault">
            <img src="assets/icon_register.png" alt="Ícone de registro" class="export-item__icon" width="18">
            <span class="action-btn">Registrar avaria</span>
            </button>

            <button type="button" class="export-item export-item--field" id="field-logout">
            <img src="assets/icon_logout-black.png" alt="Ícone de sair" class="export-item__icon" width="18">
            <span class="action-btn">Sair</span>
            </button>
        </div>


    </main> 
<script src="equipamentos-iniciais.js"></script>
<script src="panna-integracao.js"></script>
</body>
</html>
