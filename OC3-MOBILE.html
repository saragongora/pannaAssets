<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panna Equipamentos</title>
  <link rel="icon" href="assets/logo_group.png" type="image/png">
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"
    integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js"
    integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq"
    crossorigin="anonymous"></script>
  <link rel="stylesheet" href="styles.css">
  <script src="https://cloudflare.com" defer></script>
<!-- ETAPA 33: interface compartilhada. -->
<script src="panna-ui.js" defer></script>
</head>


<body class="page page--home">
    <header>
       <nav class="navbar">
            <ul class="navbar__list">
                <li><button type="button" class="navbar__btn-menu" id="toggle-sidebar" aria-label="Mostrar ou ocultar menu lateral" aria-expanded="true"><img src="assets/btn_menu.svg" alt="botao menu"></button></li>
                <li class="navbar__item"><img class="navbar__logo" id="navbar-logo" src="assets/logo_group.png"></li>
            </ul>    
        </nav>
    </header>

     <main class="main-content main-content--field">
        <h1 class="title-h1">Abrir chamado</h1>
        <h3 class="title-h3">Informe o tipo de manutenção e a prioridade.</h3>

        <div class="form-card--qrcode form-card--field">    
            <h2 class="title-h2 field-form__name">Aspirador de pó industrial</h2>
        <h3 class="title-h3 field-form__code">EQP-00185538</h3>          

        <div class="form-group field-form__group">
        <label class="title-h4" for="equipment-type-maintenance">TIPO DE MANUTENÇÃO</label>
        <select class="register-form__input input_select form-select" id="equipment-type-maintenance">
            <option value="">Selecione</option>
        </select>
        
        </div>

        <div class="form-group field-form__group">
            <label class="title-h4" for="ticket-priority">NÍVEL DE PRIORIDADE</label>
            <select class="register-form__input input_select form-select" id="ticket-priority">
                <option value="">Selecione</option>
            </select>
        </div>

        <div class="field-form__group form-group">
        <label class="title-h4" for="ticket-comment">COMENTÁRIO</label>
        <textarea class="register-form__input input_select field-form__textarea" placeholder="Descreva o problema" name="ticket-comment" id="ticket-comment"></textarea>
        </div>    

        <div class="register-form__actions">
        <button type="button" class="button--cancel field-form__btn" onclick="window.location.href = 'OC1-MOBILE.html'">Cancelar</button>
        <button type="button" class="button--register-equip field-form__btn" id="submit-ticket">Enviar chamado</button>
        </div>
        </div>
    </main> 
<script src="equipamentos-iniciais.js"></script>
<script src="panna-integracao.js"></script>
</body>
</html>
