<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Operação em campo · Panna Equipamentos</title>
    <link rel="icon" href="assets/logo_group.png" type="image/png">
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js" integrity="sha384-I7E8VVD/ismYTF4hNIPjVp/Zjvgyol6VFvRkX/vR+Vc4jQkC+hVqc2pM8ODewa9r" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.min.js" integrity="sha384-89aa4glufciPv46aKltztWQEmk+Tu9W2RhzXr6VcnUUEub7F8+06RcL2RYLCOHUq" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="styles.css">
</head>

<!-- ETAPA 26: menu inicia recolhido em qualquer tamanho de tela. -->
<body class="page page--maintenance sidebar-collapsed">
    <header>
        <nav class="navbar">
            <ul class="navbar__list">
                <li><button type="button" class="navbar__btn-menu" id="toggle-sidebar" aria-label="Mostrar ou ocultar menu lateral" aria-expanded="false"><img src="assets/btn_menu.svg" alt="botao menu"></button></li>
                <li class="navbar__item"><img class="navbar__logo" id="navbar-logo" src="assets/logo_group.png" alt="Grupo Panna"></li>
                <li class="navbar__item" id="navbar-manage-equipment"> • Gestão interna</li>
            </ul>
        </nav>
    </header>

    <div class="layout-container">
        <div class="sidebar" id="side-menu">
            <ul>
                <li class="sidebar__buttons"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='CE1.html'"><img src="assets/icon_file.svg" alt="botao menu">Cadastrar Equipamentos</button></li>
                <li class="sidebar__buttons"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='GE1.html'"><img src="assets/icon_box.svg" alt="botao menu">Gerenciar Equipamentos</button></li>
                <li class="sidebar__buttons"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='TE1.html'"><img src="assets/icon_truck.svg" alt="botao menu">Transferir</button></li>
                <li class="sidebar__buttons"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='#'"><img src="assets/icon_maintenance.png" alt="botao menu" style="width: 20px; height: 20px;">Manutenção</button></li>
                <li class="sidebar__buttons"><button type="button" class="navbar__btn-menu" onclick="window.location.href ='#'"><img src="assets/icon_report.png" alt="botao menu" style="width: 20px; height: 20px;">Relatórios</button></li>
            </ul>

            <footer class="footer_sidebar">
                <button type="button" class="navbar__btn-menu" onclick="window.location.href = 'index.html'">
                    <img src="assets/logo_profile.svg" alt="botao menu">
                </button>
            </footer>
        </div>

        <main class="main-content">
            <header class="screen__header">
                <div>
                    <h1 class="title-h1">Operação em campo</h1>
                    <h3 class="title-h3"><span class="responsive-text responsive-text--desktop">Identifique o equipamento pelo QR Code ou pelo código para abrir chamados e registrar avarias.</span><span class="responsive-text responsive-text--mobile">Leia o QR Code ou digite o código e escolha a ação.</span></h3>
                </div>
            </header>
            <section class="field-panel">
                <div class="field-panel__identify">
                    <h2 class="title-h2">Identificar equipamento</h2>

                    <div class="qr-scan" id="qr-frame">
                        <video class="qr-scan__video" id="qr-video" playsinline muted hidden></video>
                        <span class="qr-scan__corner qr-scan__corner--top-left"></span>
                        <span class="qr-scan__corner qr-scan__corner--top-right"></span>
                        <span class="qr-scan__corner qr-scan__corner--bottom-left"></span>
                        <span class="qr-scan__corner qr-scan__corner--bottom-right"></span>
                        <svg class="qr-scan__icon" viewBox="0 0 56 56" fill="none" stroke="#1A1A1A" stroke-width="3.5" stroke-linecap="round" aria-hidden="true">
                            <rect x="4" y="4" width="18" height="18" rx="2"/><rect x="34" y="4" width="18" height="18" rx="2"/>
                            <rect x="4" y="34" width="18" height="18" rx="2"/><path d="M34 38h18M43 30v22"/>
                        </svg>
                    </div>
                    <button type="button" class="button--cancel field-panel__qr-button" id="qr-start">Ler QR Code</button>

                    <p class="field-qr__or">ou</p>

                    <div class="form-group">
                        <label class="title-h4" for="equipment-code">CÓDIGO DO EQUIPAMENTO</label>
                        <input class="register-form__input" type="text" id="equipment-code" placeholder="Digite o código ou leia o QR Code" autocomplete="off">
                        <p class="field-panel__hint" id="field-hint" role="status"></p>
                    </div>
                    <!-- ETAPA 29: removido o botão de consulta; o operador escolhe diretamente a ação após identificar o equipamento. -->
                </div>

                <!-- ETAPA 29: ações começam neutras, sem opção pré-selecionada. -->
                <div class="action-tiles">
                    <button type="button" class="action-tiles__item" id="field-open-ticket">
                        <span class="action-tiles__icon-box"><svg class="action-tiles__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.5 2a3.5 3.5 0 0 0-3 5L2 12.5 3.5 14 9 8.5a3.5 3.5 0 0 0 5-3l-2 2-2-.5-.5-2 2-2z"/></svg></span>
                        <span>Abrir <span class="responsive-text responsive-text--mobile">chamado de manutenção</span><span class="responsive-text responsive-text--desktop">chamado</span></span>
                    </button>
                    <button type="button" class="action-tiles__item" id="field-report-fault">
                        <span class="action-tiles__icon-box"><svg class="action-tiles__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l10 10M13 3L3 13"/></svg></span>
                        <span>Registrar avaria</span>
                    </button>
                    <button type="button" class="action-tiles__item" id="field-logout">
                        <span class="action-tiles__icon-box"><svg class="action-tiles__icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M13 8H3M7 4L3 8l4 4"/></svg></span>
                        <span>Sair</span>
                    </button>
                </div>
            </section>
        </main>
    </div>

    <!-- JavaScript compartilhado: menu, armazenamento e telas de manutenção. -->
    <script src="equipamentos-iniciais.js"></script>
    <script src="panna.js"></script>
    <script src="panna-integracao.js"></script>
</body>
</html>
